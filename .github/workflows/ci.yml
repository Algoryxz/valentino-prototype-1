name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: valentino_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Fail if unauthorized lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            echo "Error: package-lock.json must not be committed. Use pnpm only."
            exit 1
          fi
          if [ -f yarn.lock ]; then
            echo "Error: yarn.lock must not be committed. Use pnpm only."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run Prisma migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/valentino_ci"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test
        env:
          APP_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/valentino_ci"
          EDIT_SECRET_PEPPER: "test-pepper-32-chars-minimum-length-key"

      - name: Build Next.js application
        run: pnpm build
        env:
          APP_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/valentino_ci"
          EDIT_SECRET_PEPPER: "test-pepper-32-chars-minimum-length-key"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: pnpm test:e2e
        env:
          APP_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/valentino_ci"
          EDIT_SECRET_PEPPER: "test-pepper-32-chars-minimum-length-key"
